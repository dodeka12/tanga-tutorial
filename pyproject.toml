[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "tanga-tutorial"
dynamic = ["version"]
description = "Tutorials for the TanGA geometric algebra library"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # tanga:start:release
    "tanga-py[compile,examples]>=1.17.0",
    # tanga:end:release
    # tanga:start:rc
    # "tanga-py[compile,examples]>=1.18.0rc1",
    # tanga:end:rc
    # tanga:start:src
    # "tanga-py[compile,examples]>=1.17.0",
    # tanga:end:src
    "jupyter>=1.0",
    "ipykernel>=6.29",
    "ipython>=8.30",
    "scipy>=1.13",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["tanga_tutorial"]

[dependency-groups]
dev = [
    "mike>=2.0",
    "mkdocs-material>=9.7.7",
    "mkdocs-jupyter>=0.24",
    "jupytext>=1.16",
]

