[project]
name = "tanga-tutorial"
version = "0.1.0"
description = "Tutorials and examples for the TanGA geometric algebra library"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "tanga-py[compile,examples]>=1.11.0",
    "jupyter>=1.0",
    "ipykernel>=6.29",
    "ipython>=8.30",
    "scipy>=1.13",
]

# [tool.uv]
# prerelease = "allow"

[tool.uv.sources]
tanga-py = { path = "../tanga", editable = true }

