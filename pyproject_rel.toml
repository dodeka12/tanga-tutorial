[project]
name = "tanga-tutorial"
version = "0.1.0"
description = "Tutorials and examples for the TanGA geometric algebra library"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "tanga-py[compile,examples]>=1.11.0",
    # pre-release version
    # "tanga-py[compile,examples]==0.11.0rc1",
    "jupyter>=1.0",
    "ipykernel>=6.29",
    "ipython>=8.30",
    "scipy>=1.13",
]

[dependency-groups]
dev = [
    "jupyter-book>=2.0.0",
]

