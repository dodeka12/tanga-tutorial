version: 1
project:
  title: TanGA Tutorial
  description: Tutorials for the TanGA geometric algebra library
  # Uncomment `github` when publishing to GitHub Pages (required for the
  # Binder-backed launch button / in-page execution below).
  # github: dodeka12/tanga-tutorial

  # Local, self-contained in-page execution (default):
  # point the book at a locally running Jupyter server, so readers can run
  # notebook cells live without any internet access.
  #
  # The `kernelName` must match a kernel installed in that server, and the
  # `token` must match the value used when starting it. Start the server with:
  #
  #   uv run scripts/serve-local.sh
  #
  # or manually:
  #
  #   jupyter lab --no-browser --ServerApp.port=8888 \
  #               --IdentityProvider.token=tanga-local \
  #               --ServerApp.allow_origin=http://localhost:3000
  #
  # The "power" button on each notebook page connects to this already-running
  # server (it does not launch one itself — launching is Binder's job).
  jupyter:
    kernelName: python3
    server:
      url: http://localhost:8888/
      token: tanga-local

  # GitHub Pages deployment (Binder-backed live execution). To use this later:
  #   1. comment out the `jupyter` block above,
  #   2. uncomment `project.github` and the `jupyter: true` line below.
  # jupyter: true

  toc:
    - file: index.md
    - title: Tutorials
      children:
        - title: Visualization
          children:
            - file: tutorials/visualization/01_quick_tour/01_quick_tour.ipynb
            - file: tutorials/visualization/02_getting_started/02_getting_started.ipynb
            - file: tutorials/visualization/03_sdf_objects/03_sdf_objects.ipynb
            - file: tutorials/visualization/04_multi_scene/04_multi_scene.ipynb
            - file: tutorials/visualization/05_scene_graphs/05_scene_graphs.ipynb
            - file: tutorials/visualization/06_styles_colors/06_styles_colors.ipynb
            - file: tutorials/visualization/07_axes_grid_camera/07_axes_grid_camera.ipynb
            - file: tutorials/visualization/08_coordinate_system/08_coordinate_system.ipynb
            - file: tutorials/visualization/09_labels/09_labels.ipynb
            - file: tutorials/visualization/10_interaction/10_interaction.ipynb
            - file: tutorials/visualization/11_animation/11_animation.ipynb
            - file: tutorials/visualization/12_split_views/12_split_views.ipynb
            - file: tutorials/visualization/13_visualizer_app/13_visualizer_app.ipynb
            - file: tutorials/visualization/14_controls/14_controls.ipynb
            - file: tutorials/visualization/15_banners_dialogs/15_banners_dialogs.ipynb
