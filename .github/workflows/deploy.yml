name: Deploy Jupyter Book to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one Pages deployment at a time; cancel any in-progress run.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Configure the site for GitHub Pages
        # Uncomment `project.github` (enables "edit on GitHub" links and the
        # Binder launch button). The base path itself is set via BASE_URL below.
        run: "sed -i 's|^  # github:|  github:|' myst.yml"

      - name: Build the book
        # BASE_URL prefixes every link with /<repo> so assets resolve at
        # https://<owner>.github.io/<repo>/ instead of the domain root.
        run: uv run jupyter-book build --html --strict --ci
        env:
          BASE_URL: /${{ github.event.repository.name }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
