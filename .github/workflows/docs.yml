name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version-bump:
    name: Determine next version
    if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine next version
        id: version
        run: |
          NEXT_VERSION=$(bash ./tools/version-tag.sh --dry-run | grep '^Next version:' | sed 's/Next version: \([^ ]*\).*/\1/')
          echo "version=$NEXT_VERSION" >> $GITHUB_OUTPUT
          echo "Next version: $NEXT_VERSION"

  push-tag:
    name: Push version tag
    needs: version-bump
    if: needs.version-bump.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and push tag
        env:
          VERSION: ${{ needs.version-bump.outputs.version }}
        run: |
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"
          echo "Pushed tag $VERSION to origin."

  docs-deploy:
    name: Build & deploy docs
    needs: [version-bump, push-tag]
    if: |
      (github.event_name == 'push' && needs.push-tag.result == 'success') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${{ needs.version-bump.outputs.version }}"
          else
            VERSION=$(git tag -l 'v*' --sort=-v:refname | grep -v '\-rc' | head -1)
            VERSION=${VERSION:-latest}
          fi
          # Ensure the bumped tag is present locally BEFORE building, so
          # hatch-vcs (during `uv sync`) and mike both see the final version.
          git fetch origin tag "$VERSION" 2>/dev/null || true
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Deploying version: $VERSION"

      - name: Install Python toolchain
        run: uv sync --group dev

      - name: Deploy docs with mike
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: uv run mike deploy --push --update-aliases "$VERSION" latest

      - name: Set default version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: uv run mike set-default --push "$VERSION"
